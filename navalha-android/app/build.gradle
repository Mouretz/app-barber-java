plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.navalha'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'br.com.navalha'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    flavorDimensions = ['papel']
    productFlavors {
        cliente {
            dimension 'papel'
            applicationIdSuffix '.cliente'
        }
        barbeiro {
            dimension 'papel'
            applicationIdSuffix '.barbeiro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
