name: Navalha APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Plataformas Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Montar o projeto
        run: |
          mkdir -p /tmp/navalha-src
          cat navalha-android/payload/part-*.b64 | tr -d '\n' | base64 -d > /tmp/navalha.tar.gz
          echo "$(cat navalha-android/payload/SHA256)  /tmp/navalha.tar.gz" | sha256sum -c
          tar -xzf /tmp/navalha.tar.gz -C /tmp/navalha-src
          test -f /tmp/navalha-src/app/build.gradle
          test -f /tmp/navalha-src/app/src/cliente/assets/index.html
          test -f /tmp/navalha-src/app/src/barbeiro/assets/index.html

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Gerar os APKs
        working-directory: /tmp/navalha-src
        run: gradle assembleDebug --no-daemon

      - name: Juntar os arquivos
        run: |
          mkdir -p dist
          cp /tmp/navalha-src/app/build/outputs/apk/cliente/debug/app-cliente-debug.apk dist/Navalha-cliente.apk
          cp /tmp/navalha-src/app/build/outputs/apk/barbeiro/debug/app-barbeiro-debug.apk dist/Navalha-barbeiro.apk

      - name: Artifact da Action
        uses: actions/upload-artifact@v4
        with:
          name: navalha-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: navalha-apk-${{ github.run_number }}
          name: Navalha APK ${{ github.run_number }}
          body: |
            Dois apps de teste para instalar direto no Android.
            - Navalha-cliente.apk — quem marca o horário
            - Navalha-barbeiro.apk — agenda da casa
          files: |
            dist/Navalha-cliente.apk
            dist/Navalha-barbeiro.apk
