name: Navalha APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # o pacote antigo "tools" (padrão da action) não existe mais no SDK
          packages: platform-tools

      - name: Plataformas Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Conferir o projeto
        run: |
          test -f navalha-android/app/build.gradle
          test -f navalha-android/app/src/cliente/assets/index.html
          test -f navalha-android/app/src/barbeiro/assets/index.html

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Gerar os APKs
        working-directory: navalha-android
        run: gradle assembleDebug --no-daemon

      - name: Juntar os arquivos
        run: |
          mkdir -p dist
          cp navalha-android/app/build/outputs/apk/cliente/debug/app-cliente-debug.apk dist/Navalha-cliente.apk
          cp navalha-android/app/build/outputs/apk/barbeiro/debug/app-barbeiro-debug.apk dist/Navalha-barbeiro.apk

      - name: Artifact da Action
        uses: actions/upload-artifact@v4
        with:
          name: navalha-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: navalha-apk-${{ github.run_number }}
          name: Navalha APK ${{ github.run_number }}
          body: |
            Dois apps de teste para instalar direto no Android.
            - Navalha-cliente.apk — quem marca o horário
            - Navalha-barbeiro.apk — agenda da casa
          files: |
            dist/Navalha-cliente.apk
            dist/Navalha-barbeiro.apk
